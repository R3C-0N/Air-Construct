name: CI complète

# Full CI: unit tests on Linux + Windows and real OpenFOAM simulations with the
# validation report. Runs only when work reaches `main` (a finished workstream merged
# from `develop`). Day-to-day branches get the fast CI (ci-fast.yml) instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  openfoam:
    name: OpenFOAM simulation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenFOAM (openfoam.com)
        # dl.openfoam.com and its sourceforge mirror often time out or answer with an
        # HTML page: fail loudly on HTTP errors and retry the whole install a few times.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
                https://dl.openfoam.com/add-debian-repo.sh -o /tmp/add-openfoam-repo.sh \
              && sudo bash /tmp/add-openfoam-repo.sh \
              && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 \
                   install -y openfoam2406-default \
              && exit 0
            echo "OpenFOAM install failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Qt system libraries
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,ui]"
      - name: Run OpenFOAM tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /usr/lib/openfoam/openfoam2406/etc/bashrc || true
          AIRCONSTRUCT_REQUIRE_OPENFOAM=1 pytest -q -rs -m openfoam
      - name: Validation report
        if: always()
        shell: bash
        run: cat runs/*/validation.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-outputs
          path: runs/
          if-no-files-found: ignore
