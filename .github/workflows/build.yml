name: Build desktop app

# Builds the frozen desktop app with PyInstaller, checks that it starts (--self-test),
# and uploads it as a workflow artifact:
#   - Windows: Air-Construct-<version>-windows-x64-setup.exe (Inno Setup) + portable .zip
#   - Linux:   Air-Construct-<version>-linux-x64.tar.gz
# Runs only for `main` (push, or a pull request into it), tags and manual runs.
# Pushing a tag v* also attaches these files to a GitHub release for that tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[ui,results]" "pyinstaller>=6.10"
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import airconstruct; print(airconstruct.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build executable
        run: pyinstaller packaging/airconstruct.spec --noconfirm --clean
      - name: Self-test the executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          AIRCONSTRUCT_SELFTEST_LOG: ${{ runner.temp }}\selftest.log
        run: |
          $p = Start-Process -FilePath dist\Air-Construct\Air-Construct.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if (Test-Path $env:AIRCONSTRUCT_SELFTEST_LOG) { Get-Content $env:AIRCONSTRUCT_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $env:AIRCONSTRUCT_SELFTEST_LOG -Pattern 'self-test OK' -Quiet)) { throw "self-test did not finish" }
      - name: MCP server answers (Air-Construct-MCP.exe)
        shell: pwsh
        run: |
          $out = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | dist\Air-Construct\Air-Construct-MCP.exe
          $out
          if (-not ($out -match '"air-construct"')) { throw "the MCP server did not answer" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Air-Construct -DestinationPath dist\Air-Construct-${{ steps.version.outputs.version }}-windows-x64-portable.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\dist\Air-Construct packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Silent install, self-test, uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          AIRCONSTRUCT_SELFTEST_LOG: ${{ runner.temp }}\installed-selftest.log
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\ac-install"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath "$dir\Air-Construct.exe" -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if (Test-Path $env:AIRCONSTRUCT_SELFTEST_LOG) { Get-Content $env:AIRCONSTRUCT_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed ($($p.ExitCode))" }
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Air-Construct-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-22.04  # oldest supported glibc, so the bundle runs on newer distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[ui,results]" "pyinstaller>=6.10"
      - name: Version
        id: version
        run: echo "version=$(python -c 'import airconstruct; print(airconstruct.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build executable
        run: pyinstaller packaging/airconstruct.spec --noconfirm --clean
      - name: Self-test the executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/Air-Construct/Air-Construct" --self-test | tee selftest.log
          grep -q "self-test OK" selftest.log
      - name: MCP server answers (Air-Construct-MCP)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$GITHUB_WORKSPACE/dist/Air-Construct/Air-Construct-MCP" | tee mcp.log
          grep -q '"air-construct"' mcp.log
      - name: Archive
        run: tar -C dist -czf dist/Air-Construct-${{ steps.version.outputs.version }}-linux-x64.tar.gz Air-Construct
      - uses: actions/upload-artifact@v4
        with:
          name: Air-Construct-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Air-Construct $TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
