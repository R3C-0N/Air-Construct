[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airconstruct"
version = "0.1.0"
description = "Open source desktop tool for air flow and heat transfer simulation (OpenFOAM based)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "numpy>=1.24",
]

[project.optional-dependencies]
results = ["pyvista>=0.43"]
cad = ["cascadio>=0.1"]  # STEP import (OpenCascade); STL needs nothing
ui = ["PySide6>=6.6", "pyvistaqt>=0.11", "pyvista>=0.43", "superqt>=0.6", "pyqtgraph>=0.13.7",
      "cascadio>=0.1"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
airconstruct = "airconstruct.cli:main"
airconstruct-mcp = "airconstruct.assistant.mcp_server:main"

[project.gui-scripts]
airconstruct-gui = "airconstruct.ui.app:main"

[tool.setuptools.packages.find]
include = ["airconstruct*"]

[tool.setuptools.package-data]
"airconstruct.ui" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["openfoam: needs an OpenFOAM installation (run with -m openfoam)"]
addopts = "-m 'not openfoam'"

[tool.ruff]
line-length = 100
